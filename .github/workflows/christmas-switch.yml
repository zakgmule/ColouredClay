# Black Friday clean-up, scheduled for 1 December 2026.
#
# The site already switches from Black Friday to Christmas by itself at exactly 00:00 Malta time
# (see BLACK_FRIDAY_ENDS in index.html). This job then merges the prepared `christmas-switch`
# branch into main a minute later, which deletes all the Black Friday code from the site.
# Netlify redeploys main automatically. The merge also deletes this workflow, so it never runs again.
#
# Malta is on CET (UTC+1) in December, so 23:01 UTC on 30 November = 00:01 on 1 December in Malta.
# GitHub can start scheduled jobs a few minutes late; that's fine because the page has already switched.
# To run it by hand: GitHub > Actions > "Christmas switch" > Run workflow (it refuses before the cutoff).

name: Christmas switch
on:
  schedule:
    - cron: "1 23 30 11 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge christmas-switch into main
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-11-30T23:00:00Z' +%s)" ]; then
            echo "Too early: Black Friday runs until 00:00 on 1 December (Malta time)."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch origin christmas-switch
          git merge --no-edit origin/christmas-switch -m "Christmas switch: remove Black Friday (scheduled)"
          git push origin HEAD:main
